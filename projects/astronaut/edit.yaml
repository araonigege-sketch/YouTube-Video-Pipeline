text:
  - {at: "One of those four", until: ">Force.", kind: label, text: "Jeremy *Hansen*", sub: "Canadian Space Agency astronaut"}
  - {at: "That’s 17 years", until: ">years.", kind: big, text: "17 years", sub: "Astronaut since 2009 · first launch 2026"}
  - at: "So how do you get picked"
    until: ">genius?"
    kind: questions
    items:
      - {t: "Do you have to be *American*?", a: "Do you have to be American"}
      - {t: "A *fighter pilot*?", a: "A fighter pilot"}
      - {t: "A *genius*?", a: "A genius"}
  - {at: "Well, only if you’re a US", until: ">requirements.", kind: label, text: "*US citizens* only", sub: "NASA requirement no. 1"}
  - at: "Hansen applied to the Canadian"
    until: ">too."
    kind: chips
    items:
      - {t: "CSA · Canada", a: "Canadian Space Agency"}
      - {t: "ESA · Europe", a: "European Space Agency"}
      - {t: "JAXA · Japan", a: "Japan"}
      - {t: "ISRO · India", a: "India"}
      - {t: "CNSA · China", a: "China"}
      - {t: "MBRSC · UAE", a: "United Arab Emirates"}
  - {at: "the first thing that shapes", until: ">passport.", kind: label, text: "Your *passport*", sub: "Decides which agency you can apply to"}
  - {at: "When Hansen was picked in 2009", until: ">astronauts.", kind: label, text: "Canada’s *third* astronaut call", sub: "2009"}
  - {at: "And when Europe chose", until: ">2009.", kind: big, text: "13 years", sub: "Between ESA astronaut classes · 2009 → 2022"}
  - {at: "Twelve thousand people", until: ">seats.", kind: big, text: "12,000 → 10"}
  - {at: "That’s about one in every", until: ">800.", kind: big, text: "1 in 800", sub: "NASA · 2025 selection"}
  - {at: "Canada’s 2009 search", until: ">two.", kind: big, text: "5,351 → 2", sub: "Canada · 2009"}
  - {at: "And Europe’s 2021 call", until: ">jobs.", kind: big, text: "22,500 → 5", sub: "ESA 2021 call · 17 picked, 5 full-time"}
  - {at: "Nobody shows that better", until: ">Hernández.", kind: label, text: "José *Hernández*", sub: "NASA astronaut · STS-128"}
  - {at: "He didn’t learn English", until: ">12.", kind: label, text: "English at *12*"}
  - {at: "NASA’s Neutral Buoyancy Laboratory", until: ">gallons,", kind: big, text: "6.2 million", sub: "Gallons · Neutral Buoyancy Laboratory"}
  - {at: "Hansen got through all of it", until: ">2011.", kind: label, text: "Graduated · *2011*", sub: "Jeremy Hansen"}
  - {at: "NASA’s own job posting", until: ">assignment.", kind: quote, text: "After training, you become *eligible* for a spaceflight assignment.", who: "NASA astronaut job posting"}
  - {at: "In late 2026, NASA had", until: ">astronauts,", kind: big, text: "32", sub: "Active NASA astronauts · late 2026"}
  - {at: "In 2017, he became", until: ">training.", kind: label, text: "First non-American to lead a *NASA class*", sub: "2017"}
  - {at: "Meanwhile, the man picked", until: ">2018.", kind: label, text: "David *Saint-Jacques*", sub: "Picked with Hansen · flew 2018"}
  - {at: "The station circles Earth", until: ">45.", kind: big, text: "90 min", sub: "One orbit · a sunrise or sunset every 45"}
  - {at: "about two and a half hours", until: ">away.", kind: big, text: "2.5 hours", sub: "Of exercise, every day"}
  - {at: "With its upgraded system", until: ">included.", kind: big, text: "98%", sub: "Of the station’s water recovered"}
  - {at: "As NASA astronaut Jessica Meir", until: ">put it,", kind: label, text: "Jessica *Meir*", sub: "NASA astronaut"}
  - {at: "today’s coffee is tomorrow’s", until: ">coffee.", kind: quote, text: "Today’s coffee is *tomorrow’s coffee*.", who: "Jessica Meir"}
  - {at: "NASA says that on four-to-six", until: ">month.", kind: big, text: "1–1.5%", sub: "Bone density lost per month in orbit"}
  - {at: "In June 2024, NASA astronauts", until: ">Williams", kind: label, text: "Butch *Wilmore* & Suni *Williams*", sub: "Boeing Starliner · June 2024"}
  - {at: "The trip was supposed", until: ">days.", kind: big, text: "8 days", sub: "The plan"}
  - {at: "After 286 days", until: ">days.", kind: big, text: "286 days", sub: "What it became"}
  - {at: "Challenger in 1986", until: ">1986", kind: label, text: "*Challenger* · 1986"}
  - {at: "and Columbia in 2003", until: ">2003.", kind: label, text: "*Columbia* · 2003"}
  - {at: "When NASA opened applications", until: ">year.", kind: big, text: "$164,000", sub: "NASA astronaut salary · 2026 posting"}
  - {at: "One of them, Anna Menon", until: ">space.", kind: label, text: "Anna *Menon*", sub: "NASA astronaut candidate · 2025"}
  - {at: "She’s the first NASA astronaut", until: ">orbit.", kind: label, text: "First NASA candidate who had *already flown*", pos: center}
  - {at: "In June 2025, Shubhanshu", until: ">pilot,", kind: label, text: "Shubhanshu *Shukla*", sub: "Indian Air Force test pilot · Axiom-4"}
