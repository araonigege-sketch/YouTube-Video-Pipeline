text:
  - {at: "That person is the CEO", until: ">CEO.", kind: label, text: "The *CEO*", pos: center}
  - {at: "and write", until: ">name.", kind: label, text: "Your Name · *CEO*", pos: center}
  - at: "find jobs for engineers"
    until: ">cleaners."
    kind: chips
    items:
      - {t: "Engineers", a: "find jobs for engineers"}
      - {t: "Designers", a: "designers"}
      - {t: "Accountants", a: "accountants"}
      - {t: "Cleaners", a: "and cleaners"}
  - {at: "You will never find", until: ">here.”", kind: label, text: "Chief Executive Officer · *Apply here*", sub: "No such posting", pos: center}
  - at: "So who does the choosing"
    until: ">take?"
    kind: questions
    items:
      - {t: "Who does the *choosing*?", a: "So who does the choosing"}
      - {t: "What are they *looking for*?", a: "What are they looking"}
      - {t: "A famous *degree*? Rich parents?", a: "Do you need a famous"}
      - {t: "How *long* does it take?", a: "And how long does it take"}
  - {at: "100,000 workers", until: ">them.", kind: big, text: "100,000", sub: "Workers · you’ll never meet most of them"}
  - {at: "Same title", until: ">job.", kind: label, text: "Same title. *Very different job.*", pos: center}
  - {at: "only 59 got", until: ">managers.", kind: big, text: "59", sub: "New CEOs · top 500 US public companies · 2025"}
  - {at: "about 2.1 million", until: ">world.", kind: big, text: "2.1 million", sub: "Walmart workers worldwide"}
  - {at: "named Doug McMillon", until: ">McMillon", kind: label, text: "Doug *McMillon*"}
  - {at: "took an hourly job", until: ">trucks.", kind: label, text: "Hourly *warehouse* job", sub: "1984"}
  - {at: "Thirty years later", until: ">company.", kind: label, text: "CEO of *Walmart*", sub: "2014 · thirty years later"}
  - {at: "John Furner", until: ">started?", kind: label, text: "John *Furner*", sub: "Walmart CEO · 2026"}
  - {at: "Bentonville, Arkansas", until: ">Arkansas.", kind: label, text: "Bentonville, *Arkansas*", sub: "Walmart garden center"}
  - at: "how sales, factories"
    until: ">together."
    kind: chips
    items:
      - {t: "Sales", a: "how sales"}
      - {t: "Factories", a: "factories"}
      - {t: "Money", a: "money, people"}
      - {t: "People", a: "people, and"}
      - {t: "Risk", a: "and risk"}
  - at: "Depth wins at the bottom"
    until: ">connects."
    kind: questions
    items:
      - {t: "*Depth* wins at the bottom", a: "Depth wins"}
      - {t: "*Breadth* wins in the middle", a: "Breadth wins"}
      - {t: "At the top: how *everything connects*", a: "At the top, what"}
  - {at: "Then he moved to Shenzhen", until: ">China.", kind: label, text: "Walmart *China*", sub: "Shenzhen · merchandising & marketing"}
  - {at: "fewer than 12 percent", until: ">degree.", kind: big, text: "<12%", sub: "Top-100 CEOs with an Ivy League first degree · 2023"}
  - {at: "Furner studied at", until: ">Arkansas.", kind: label, text: "University of *Arkansas*"}
  - {at: "after what Apple called", until: ">process.", kind: quote, text: "A long-term succession planning process", who: "Apple"}
  - {at: "Jamie Dimon knows", until: ">well.", kind: label, text: "Jamie *Dimon*"}
  - {at: "He spent about 15 years", until: ">Citigroup.", kind: label, text: "~15 years beside his *mentor*", sub: "Building what became Citigroup", pos: top}
  - {at: "that lost 511 million", until: ">year.", kind: big, text: "−$511M", sub: "Bank One · 2000"}
  - {at: "45 percent had suffered", until: ">job.", kind: big, text: "45%", sub: "of 2,000+ CEO candidates had a major career blowup"}
  - {at: "Jensen Huang did exactly", until: ">that.", kind: label, text: "Jensen *Huang*"}
  - {at: "Then in 1993", until: ">graphics.", kind: label, text: "*1993* · a Denny’s booth", sub: "San Jose · age 30 · two engineers", pos: top}
  - {at: "He ran Nvidia for 33", until: ">boom,", kind: big, text: "33 years", sub: "Running Nvidia"}
  - at: "Founder."
    until: ">company."
    kind: chips
    items:
      - {t: "Founder", a: "Founder."}
      - {t: "CEO", a: "CEO. The"}
      - {t: "The face of the company", a: "The face of"}
  - {at: "Thirty-three years in the chair", until: ">decision.", kind: big, text: "33 years", sub: "Ended by one board decision"}
  - {at: "Steve Jobs was pushed", until: ">1985.", kind: label, text: "Steve *Jobs*", sub: "Pushed out of Apple · 1985"}
  - {at: "Mary Barra started", until: ">student.", kind: label, text: "Mary *Barra*", sub: "General Motors · 1980 · age 18"}
  - {at: "Over the next three decades", until: ">development.", kind: label, text: "Engineering · a car plant · HR · *product*", pos: top}
  - {at: "A few months later", until: ">Congress.", kind: label, text: "The U.S. *Congress*", sub: "2014"}
  - {at: "8.5 years on average", until: ">five.", kind: big, text: "8.5 years", sub: "Average tenure · CEOs who stepped down in 2025"}
  - {at: "about 54 years old", until: ">before.", kind: big, text: "54", sub: "Average age of new CEOs"}
  - {at: "84 percent had never", until: ">before.", kind: big, text: "84%", sub: "Had never been a CEO before"}
  - at: "The right boss"
    until: ">ready."
    kind: chips
    items:
      - {t: "The right boss", a: "The right boss"}
      - {t: "The right division", a: "The right division"}
      - {t: "A seat that opens", a: "A seat that opens"}
  - at: "Raise your hand"
    until: ">money."
    kind: questions
    items:
      - {t: "Raise your hand for the work *nobody else wants*", a: "Raise your hand"}
      - {t: "Run the *small project*", a: "Run the small"}
      - {t: "Fix the *struggling team*", a: "Fix the struggling"}
      - {t: "Learn how your company *makes money*", a: "Learn exactly"}
  - {at: "do we trust this person", until: ">company?", kind: label, text: "Do we trust this person with *the whole company*?", pos: center}

