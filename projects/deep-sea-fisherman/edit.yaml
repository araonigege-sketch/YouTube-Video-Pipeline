text:
  - {at: "No degree", until: ">school.", kind: chips, items: [{t: "No degree", a: "No degree"}, {t: "No exam", a: "No exam"}, {t: "No years of school", a: "No years"}]}
  - at: "Do you need special"
    until: ">worth it?"
    kind: questions
    items:
      - {t: "Special *qualifications*?", a: "Do you need special"}
      - {t: "How do beginners get *hired*?", a: "How does a total"}
      - {t: "How *dangerous* is it?", a: "How dangerous is it"}
      - {t: "Is the *money* worth it?", a: "And is the money"}
  - {at: "about as long as a football", until: ">fish are", kind: label, text: "About as long as a *football field*", pos: center}
  - {at: "But Alaska is one", until: ">from.", kind: label, text: "Alaska", sub: "Where most of our examples come from"}
  - {at: "part factory worker", until: ">mechanic.", kind: chips, items: [{t: "Factory worker", a: "part factory"}, {t: "Sailor", a: "part sailor"}, {t: "Mechanic", a: "and part mechanic"}]}
  - {at: "He’s 23", until: ">need?", kind: label, text: "Meet *Daniel*", sub: "23 · never worked on a boat"}
  - {at: "The first way is the factory", until: ">factory.", dur: 2.4, kind: label, text: "Way 1 · *The factory*"}
  - {at: "The second way", until: ">salmon.", dur: 2.4, kind: label, text: "Way 2 · *Summer salmon*"}
  - {at: "limited to 32 feet", until: ">feet,", dur: 2.2, kind: label, text: "32 feet", sub: "Bristol Bay drift boats"}
  - {at: "And the third way", until: ">school:", kind: label, text: "Way 3 · *Walking the docks*"}
  - {at: "16-hour shifts", until: ">months.", kind: big, text: "16 hours", sub: "A day · 7 days a week · ~2-month contracts"}
  - {at: "You already live at work", until: ">work.", dur: 2.0, kind: label, text: "You already *live at work*", pos: center}
  - {at: "sixty seconds or less", until: ">drills.", kind: big, text: "60 seconds", sub: "Or less · the drill target"}
  - {at: "A wet deck", until: ">help.", kind: chips, items: [{t: "Wet deck + sudden wave", a: "A wet deck"}, {t: "Heavy gear + tired crew", a: "Heavy gear"}, {t: "Freezing water + hours from help", a: "Freezing water"}]}
  - {at: "3,600 and 5,000", until: ">worth.", kind: big, text: "$3,600–$5,000", sub: "Per trip · entry-level processor average · Glacier Fish Co."}
  - {at: "And since you live", until: ">covered.", kind: label, text: "Room & food *covered*"}
  - {at: "Daniel will miss birthdays", until: ">signal.", kind: chips, items: [{t: "Birthdays", a: "birthdays"}, {t: "Holidays", a: "holidays"}, {t: "Evenings at home", a: "ordinary evenings"}, {t: "No phone signal", a: "often without"}]}
  - {at: "It takes endurance", until: ">ocean.", kind: chips, items: [{t: "Endurance", a: "It takes endurance"}, {t: "Discipline", a: "discipline"}, {t: "A strong stomach", a: "a strong stomach"}, {t: "Teamwork", a: "the ability"}, {t: "Respect for the ocean", a: "a healthy respect"}]}
  - {at: "Getting hired, and proving", until: ">story.", kind: label, text: "Getting in: *simple*. Getting hired: *another story*.", pos: center}
  - {at: "In the US, the State", until: ">page.", kind: label, text: "State of Alaska", sub: "Seafood jobs page"}
  - {at: "how your share", until: ">paid.", kind: label, text: "Know how your *share* is paid"}

credits_extra:
  - "Facts: US Bureau of Labor Statistics (Occupational Outlook; Census of Fatal Occupational Injuries 2024); Alaska Dept. of Fish & Game (crewmember licence fees; Bering Sea snow crab catch limits); US Coast Guard (crab fleet dockside checks, 1999); Glacier Fish Company (entry-level processor pay); figures as narrated."
