<!doctype html>
<html><head><meta charset="utf-8"><title>Case File player</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="map.js"></script>
<script src="world.js"></script>
<script src="shots.js"></script>
<script>
// Case File player: renders window.SHOTS (built by tools/build_shots.py from the narration's word timings).
// Every frame is a pure function of time. Shot types: sheet, spread, card, list, compare, map_eu, map_world,
// tree, timeline, doubling, marbles, surnames, battery, verdict, endcard.
const W = 1920, H = 1080, FPS = 30;
const END = window.FILM.end, FRAMES = Math.ceil(END * FPS);
const C = document.getElementById('c'), ctx = C.getContext('2d');
const COL = { paper: '#e9e0cb', ink: '#2a221b', inkSoft: 'rgba(42,34,27,0.62)', red: '#b3321d', label: '#efe6d1', land: '#e6d8b6',

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function off(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- assets ----------
const IMG = {};
function loadImg(k) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => rej(new Error('img ' + k)); i.src = 'img/' + k + '.jpg'; }); }
const FONTS = [['IM Fell English', 'fonts/im-fell-english-latin-400-normal.woff2', {}], ['IM Fell English', 'fonts/im-fell-english-latin-400-italic.woff2', { style: 'italic' }],
  ['Courier Prime', 'fonts/courier-prime-latin-400-normal.woff2', {}], ['Courier Prime', 'fonts/courier-prime-latin-700-normal.woff2', { weight: '700' }],
  ['IBM Plex Sans Condensed', 'fonts/ibm-plex-sans-condensed-latin-400-normal.woff2', {}], ['IBM Plex Sans Condensed', 'fonts/ibm-plex-sans-condensed-latin-600-normal.woff2', { weight: '600' }]];
function loadFonts() { return Promise.all(FONTS.map(([n, u, d]) => new FontFace(n, `url(${u})`, d).load().then(f => document.fonts.add(f)))); }

// ---------- textures ----------
let DESK, GRAIN = [], PAPERTEX, MAPC, WORLDC, SPECK;
function buildTextures() {

  const id = g.getImageData(0, 0, 512, 512), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (r2() - .5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; } g.putImageData(id, 0, 0);
  for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(120,100,70,${.04 + r2() * .06})`; g.lineWidth = .6; const x = r2() * 512, y = r2() * 512; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + (r2() - .5) * 30, y + (r2() - .5) * 30, x + (r2() - .5) * 40, y + (r2() - .5) * 40); g.stroke(); }
  const r3 = rng(23);
  for (let k = 0; k < 6; k++) { const c = off(480, 270), gg = c.getContext('2d'), im = gg.createImageData(480, 270);
    for (let i = 0; i < im.data.length; i += 4) { const v = r3() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } gg.putImageData(im, 0, 0); GRAIN.push(c); }

function paperRect(g, x, y, w, h, dark = 0) {

  e.addColorStop(0, 'rgba(0,0,0,0)'); e.addColorStop(1, `rgba(110,80,40,${.16 + dark})`); g.fillStyle = e; g.fillRect(x, y, w, h); g.restore();

  const S = 2, c = off(M.w * S, M.h * S), g = c.getContext('2d'); g.scale(S, S);
  paperRect(g, 0, 0, M.w, M.h); g.fillStyle = 'rgba(160,175,170,0.12)'; g.fillRect(0, 0, M.w, M.h);
  if (world) { g.strokeStyle = 'rgba(55,70,72,0.16)'; g.lineWidth = 1; g.stroke(new Path2D(M.grat)); }
  const land = new Path2D(M.land); g.lineJoin = 'round';
  for (const w of (world ? [26, 18, 12, 7] : [54, 42, 32, 24, 17, 11, 6])) { g.lineWidth = w; g.strokeStyle = 'rgba(55,70,72,0.30)'; g.stroke(land); g.lineWidth = w - 2; g.strokeStyle = '#e5e1cf'; g.stroke(land); }
  g.fillStyle = COL.land; g.fill(land);
  g.save(); g.clip(land); g.globalAlpha = .5; g.globalCompositeOperation = 'multiply'; g.fillStyle = g.createPattern(PAPERTEX, 'repeat'); g.fillRect(0, 0, M.w, M.h); g.restore();
  g.lineWidth = world ? 1.2 : 1.7; g.strokeStyle = '#3b3027'; g.stroke(land);
  g.fillStyle = 'rgba(52,62,64,0.75)'; g.textAlign = 'center';
  for (const [t, k, s, rot] of labels) { const p = M.labels[k]; g.save(); g.translate(p[0], p[1]); g.rotate(rot); g.font = `italic ${s}px ${FELL}`; g.letterSpacing = '6px'; g.fillText(t, 0, 0); g.restore(); }
  return c;
}

// ---------- primitives ----------
function shadowOn(b = 40, oy = 18, a = .55) { ctx.shadowColor = `rgba(0,0,0,${a})`; ctx.shadowBlur = b; ctx.shadowOffsetY = oy; ctx.shadowOffsetX = oy * .35; }
function shadowOff() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = ctx.shadowOffsetY = 0; }
function cam(s, cx, cy, shake = 0, seed = 0) { const sx = shake ? Math.sin(seed * 91.7) * shake : 0, sy = shake ? Math.cos(seed * 57.3) * shake : 0;
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(s, s); ctx.translate(-cx, -cy); }
function camPath(t, sh, c) { // c: {z:[z0,z1], x:[x0,x1], y:[y0,y1]} in world coords; reframes = cuts to a new framing
  if (sh.reframes) { let r = null, nx = null; for (const q of sh.reframes) { if (t >= q.t) r = q; else if (!nx) nx = q; }
    if (r) { const p = E.io(prog(t, r.t, nx ? nx.t : sh.t1)); return [r.z * (1 + .03 * p), r.x + (r.dx || 0) * p, r.y]; } }
  const p = E.io(prog(t, sh.t0, (sh.reframes && sh.reframes[0]) ? sh.reframes[0].t : sh.t1)); c = c || {};
  const z = c.z || [1.0, 1.05], x = c.x || [960, 960], y = c.y || [540, 540];
  return [lerp(z[0], z[1], p), lerp(x[0], x[1], p), lerp(y[0], y[1], p)];
}
function sheet(img, cx, cy, h, rot, kind = 'page', o = {}) {
  const ar = img.width / img.height; let w = h * ar; if (o.maxw && w > o.maxw) { w = o.maxw; h = w / ar; }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  if (kind === 'page') {
    shadowOn(46, 22, .6); ctx.fillStyle = COL.paper; ctx.fillRect(-w / 2, -h / 2, w, h); shadowOff(); paperRect(ctx, -w / 2, -h / 2, w, h, .05);
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .96; ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  } else if (kind === 'print') {

    shadowOn(40, 20, .65); ctx.fillStyle = '#efe9dc'; ctx.fillRect(-w / 2 - b, -h / 2 - b, w + 2 * b, h + 2 * b); shadowOff();
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    if (o.tone) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = o.tone; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.globalCompositeOperation = 'source-over'; }
  } else if (kind === 'disc') {
    const rr = h * (o.r ?? .43), dx = (o.dx ?? 0) * h, dy = (o.dy ?? 0) * h;
    ctx.save(); shadowOn(50, 26, .75); ctx.beginPath(); ctx.arc(dx, dy, rr, 0, 7); ctx.fillStyle = '#3a3630'; ctx.fill(); shadowOff(); ctx.clip(); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
  }

  return { w, h, pt: (u, v) => { const x = -w / 2 + u * w, y = -h / 2 + v * h; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; } };
}
function label(t, t0, x, y, rot, head, lines, o = {}) {
  const p = E.out(prog(t, t0, t0 + .45)); if (p <= 0) return;
  const fs = o.size ?? 24, lh = fs * 1.32, pad = 18;
  ctx.save(); ctx.font = `${fs}px ${MONO}`;
  const w = o.w ?? Math.max(head ? ctx.measureText(head).width * 1.1 : 0, ...lines.map(l => ctx.measureText(l).width)) + pad * 2 + 6;
  const hr = head ? 1 : 0, h = pad * 2 + lh * (lines.length + hr);
  ctx.translate(x, y + (1 - p) * 26); ctx.rotate(rot); ctx.globalAlpha = p;
  shadowOn(16, 8, .5); ctx.fillStyle = COL.label; ctx.fillRect(0, 0, w, h); shadowOff(); paperRect(ctx, 0, 0, w, h, -.05);

  if (head) { ctx.font = `700 ${fs * .82}px ${MONO}`; ctx.letterSpacing = '3px'; ctx.fillStyle = COL.red; ctx.fillText(head, pad + 6, pad); ctx.letterSpacing = '0px'; }

    c = off(Math.ceil(bw + 20), Math.ceil(bh + 20)); const g = c.getContext('2d'); g.translate(10, 10); g.strokeStyle = COL.red; g.fillStyle = COL.red;
    g.lineWidth = size * .07; g.strokeRect(0, 0, bw, bh); g.lineWidth = size * .03; g.strokeRect(size * .12, size * .12, bw - size * .24, bh - size * .24);
    g.font = ctx.font; g.letterSpacing = ctx.letterSpacing; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, bw / 2 + size * .06, sub ? bh * .4 : bh / 2 + size * .04);
    if (sub) { g.font = `700 ${size * .34}px ${MONO}`; g.letterSpacing = `${size * .08}px`; g.fillText(sub, bw / 2, bh * .76); }

  const w = ctx.measureText(text).width + 50; ctx.fillStyle = 'rgba(14,11,9,0.78)'; ctx.fillRect(70, 62, w, 58); ctx.fillStyle = COL.red; ctx.fillRect(70, 62, 6, 58);

}
function grainAndVignette(f) {

  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .72); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

function chartSheet(title, sub, o = {}) {
  shadowOn(50, 24, .6); ctx.fillStyle = COL.paper; ctx.fillRect(80, 20, 1760, 1040); shadowOff(); paperRect(ctx, 80, 20, 1760, 1040);
  ctx.strokeStyle = 'rgba(42,34,27,.5)'; ctx.lineWidth = 1.2; ctx.strokeRect(110, 50, 1700, 980);
  if (title) { ctx.fillStyle = COL.ink; ctx.font = `66px ${FELL}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillText(title, 170, 150); }

// ---------- shot renderers ----------
const R = {};

  const r = rng(5), palA = ['#b3321d', '#3d5a73'], palB = ['#b3321d', '#3d5a73', '#4f6f52', '#a8822f', '#6b4a7a', '#c97b3a', '#2f7f7a', '#8a8f2f', '#9b3d5b', '#5a6f9e', '#7a5a3a', '#3f9e6b'];
  const bag = (cx, pal, at, title, sub) => { const p = E.out(prog(t, at, at + .6)); if (p <= 0) return; ctx.save(); ctx.globalAlpha *= p;
    ctx.fillStyle = 'rgba(120,95,60,.18)'; ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(cx, 620, 300, 260, 0, 0, 7); ctx.fill(); ctx.stroke();
    const rr = rng(cx); for (let i = 0; i < 110; i++) { const a = rr() * 6.283, d = Math.sqrt(rr()) * 235, x = cx + Math.cos(a) * d, y = 620 + Math.sin(a) * d * .85;
      if (rr() > prog(t, at, at + 1.6)) continue; ctx.fillStyle = pal[Math.floor(rr() * pal.length)]; ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x - 5, y - 5, 5, 0, 7); ctx.fill(); }
    ctx.textAlign = 'center'; ctx.fillStyle = COL.ink; ctx.font = `48px ${FELL}`; ctx.fillText(title, cx, 300); ctx.font = `24px ${MONO}`; ctx.fillStyle = COL.inkSoft; ctx.fillText(sub, cx, 940); ctx.restore(); };
  bag(560, palA, s.a, 'from two small jars', 'only a few colours'); bag(1360, palB, s.b, 'from many jars, long ago', 'hundreds of colours, mixed');
  if (s.mark != null) { const p = E.out(prog(t, s.mark, s.mark + .5)); if (p > 0) { ctx.save(); ctx.strokeStyle = COL.red; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(1360, 620, 330 + 8 * p, 290, 0, -1.6, -1.6 + 6.6 * p); ctx.stroke(); ctx.restore();
    stamp(t, s.mark + .3, 1360, 230, -.06, 'HUMAN DNA', 40); } }
  ctx.restore();
};
R.surnames = (t, s) => { // surname lines dying out over generations
  ctx.save(); cam(...camPath(t, s, s.cam || { z: [1, 1.02] })); chartSheet('Surnames, generation by generation', 'HOW LINES DISAPPEAR');
  const names = ['Abel', 'Baker', 'Carter', 'Dalton', 'Ellis', 'Fisher', 'Grant', 'Hale'], G = 7, r = rng(9);
  const alive = names.map(() => []), dieAt = [2, 5, 1, 4, 3, 6, 7, 2]; // generation where the line ends; 7 = survives
  const p = prog(t, s.t0 + .3, s.t0 + .3 + (s.grow ?? 5)); const gShown = Math.floor(p * G) + 1;
  names.forEach((n, i) => { const y = 280 + i * 88, survive = dieAt[i] >= G; ctx.font = `34px ${FELL}`; ctx.textAlign = 'right'; ctx.fillStyle = survive && t > (s.hi ?? 1e9) ? COL.red : COL.ink; ctx.fillText(n, 360, y + 12);
    const end = Math.min(gShown, dieAt[i]); ctx.strokeStyle = survive && t > (s.hi ?? 1e9) ? COL.red : COL.ink; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(400, y); ctx.lineTo(400 + end * 180, y); ctx.stroke();
    for (let g = 0; g <= end; g++) { ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(400 + g * 180, y, 9, 0, 7); ctx.fill(); }
    if (dieAt[i] < G && gShown > dieAt[i]) { ctx.fillStyle = COL.red; ctx.font = `700 22px ${MONO}`; ctx.textAlign = 'left'; ctx.fillText('ends: only daughters', 420 + dieAt[i] * 180, y + 8); } });
  ctx.font = `22px ${MONO}`; ctx.fillStyle = COL.inkSoft; ctx.textAlign = 'center'; for (let g = 0; g <= G; g++) ctx.fillText(g === 0 ? 'then' : '+' + g * 4 + ' gen.', 400 + g * 180, 990);
  ctx.restore();
};
R.battery = (t, s) => { // luminescence dating as a slowly charging battery
  ctx.save(); cam(...camPath(t, s, s.cam || { z: [1, 1.02] })); chartSheet('The stone clock', 'HOW HEATED FLINT IS DATED');
  const bx = 960, by = 560, bw = 520, bh = 240;
  let lvl = prog(t, s.charge, s.charge + 2.4) * .55; if (s.reset != null && t > s.reset) lvl = Math.max(0, .55 - prog(t, s.reset, s.reset + .35) * .55); if (s.again != null && t > s.again) lvl = prog(t, s.again, s.again + 3.5) * .8;
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 6; ctx.strokeRect(bx - bw / 2, by - bh / 2, bw, bh); ctx.fillStyle = COL.ink; ctx.fillRect(bx + bw / 2, by - 40, 30, 80);
  ctx.fillStyle = COL.red; ctx.fillRect(bx - bw / 2 + 14, by - bh / 2 + 14, (bw - 28) * lvl, bh - 28);
  ctx.font = `44px ${FELL}`; ctx.textAlign = 'center'; ctx.fillStyle = COL.ink; ctx.fillText(s.reset != null && t > s.reset && (s.again == null || t < s.again) ? 'heated in a fire: reset to zero' : 'natural energy from the ground', bx, by + bh / 2 + 80);
  if (s.reset != null && t > s.reset - .2 && (s.again == null || t < s.again + .5)) { const f = 1 - prog(t, s.reset + .6, s.reset + 1.4); ctx.save(); ctx.globalAlpha *= f; ctx.fillStyle = '#c9561d';
    for (let i = 0; i < 9; i++) { const x = bx - 200 + i * 50, h = 60 + 40 * Math.sin(t * 9 + i * 1.7); ctx.beginPath(); ctx.moveTo(x - 20, by - bh / 2 - 10); ctx.quadraticCurveTo(x, by - bh / 2 - 10 - h, x + 20, by - bh / 2 - 10); ctx.fill(); } ctx.restore(); }
  if (s.again != null && t > s.again + 1) bigText(t, s.again + 1, 'charge since the fire = time since the fire', bx, 290, { size: 40, italic: true, col: COL.red });
  ctx.restore();
};
R.verdict = (t, s) => { // four-tier verdict board
  ctx.save(); cam(...camPath(t, s, s.cam || { z: [1, 1.02] })); chartSheet('The verdict', 'WHAT THE EVIDENCE CAN AND CAN\'T SAY');
  const cols = [['Settled', COL.ink], ['Interpretation', COL.blue], ['Still argued', COL.gold], ['Beyond science', COL.red]];
  cols.forEach(([h, c], i) => { const at = s.at[i]; const p = E.out(prog(t, at, at + .5)); if (p <= 0) return; const x = 170 + i * 405;
    ctx.save(); ctx.globalAlpha *= p * (s.focus != null && s.focus !== i && t > (s.focusAt ?? 0) ? .35 : 1);
    ctx.fillStyle = c; ctx.fillRect(x, 240, 370, 8); ctx.font = `48px ${FELL}`; ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.fillText(h, x, 310);
    let y = 380; for (const it of s.items[i]) { if (t < it.at) continue; ctx.globalAlpha = p * E.out(prog(t, it.at, it.at + .4)) * (s.focus != null && s.focus !== i && t > (s.focusAt ?? 0) ? .35 : 1);
      ctx.font = `33px ${SANS}`; ctx.fillStyle = COL.ink; for (const l of wrap(it.text, `33px ${SANS}`, 360)) { ctx.fillText(l, x, y); y += 42; } y += 30; }
    ctx.restore(); });
  ctx.restore();
};
R.endcard = (t, s) => { // like & subscribe, in the Case File look
  ctx.save(); cam(1, 960, 540); const [ox, oy] = arrive(t, s.t0, [0, 1], .4); ctx.translate(ox, oy);
  chartSheet(null, null); bigText(t, s.t0 + .2, 'Open the next file', 960, 330, { size: 84 });
  const bt = (x, at, text, red) => { const p = E.back(prog(t, at, at + .45)); if (p <= 0) return; const press = s.press && t > s.press[text] && t < s.press[text] + .25 ? .92 : 1;
    ctx.save(); ctx.translate(x, 620); ctx.scale(p * press, p * press); shadowOn(14, 6, .3); ctx.fillStyle = red ? COL.red : '#f2ead8'; ctx.fillRect(-210, -60, 420, 120); shadowOff();
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.strokeRect(-210, -60, 420, 120); ctx.fillStyle = red ? '#f6efe0' : COL.ink; ctx.font = `700 40px ${MONO}`; ctx.letterSpacing = '4px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 2); ctx.restore(); };
  bt(560, s.like, 'LIKE', false); bt(960, s.share, 'SHARE', false); bt(1360, s.sub, 'SUBSCRIBE', true);
  if (s.press) for (const [k, at] of Object.entries(s.press)) { if (t > at && t < at + .6) { const x = { LIKE: 560, SHARE: 960, SUBSCRIBE: 1360 }[k]; stamp(t, at, x + 120, 720, -.12, 'DONE', 30, null); } }
  ctx.restore();
  const f = prog(t, END - .8, END); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
};

// ---------- frame ----------
const SH = window.SHOTS; let lastIdx = 0;
function shotAt(t) { if (SH[lastIdx] && t >= SH[lastIdx].t0 && t < SH[lastIdx].t1) return SH[lastIdx];
  let lo = 0, hi = SH.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (SH[m].t0 <= t) lo = m; else hi = m - 1; } lastIdx = lo; return SH[lo]; }
window.renderFrame = (i) => {
  const t = i / FPS; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; shadowOff();
  ctx.drawImage(DESK, 0, 0);
  const s = shotAt(t); try { R[s.type](t, s); } catch (e) { console.error('shot', s.id, e); throw e; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; grainAndVignette(i);
};
window.captureFrame = (frame, type = 'image/png', quality = 0.95) => { window.renderFrame(frame); return C.toDataURL(type, quality); };
const NEED = [...new Set(SH.flatMap(s => [s.img, s.side, ...(s.items || []).map(x => x.img)]).filter(Boolean))];
window.READY = loadFonts().then(() => Promise.all(NEED.map(loadImg))).then(() => document.fonts.ready).then(() => {
  buildTextures(); window.renderFrame(0); return { frames: FRAMES, fps: FPS, width: W, height: H, renderer: 'canvas2d' };
});
