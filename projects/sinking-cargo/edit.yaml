text:
  - {at: "On June 17, 2013", dur: 3.6, kind: label, text: "*MOL Comfort*", sub: "June 17, 2013 · Indian Ocean"}
  - {at: "was sailing from Singapore", dur: 3.0, kind: label, text: "Singapore → *Jeddah*"}
  - {at: "4,382 containers", dur: 4.0, kind: big, text: "4,382", sub: "CONTAINERS ON BOARD"}
  - {at: "All 26 crew members", dur: 3.0, kind: label, text: "All *26* crew rescued"}
  - {at: "Does the shipping company", kind: questions, until: ">who actually owns it?", items: [{t: "Who pays everyone back?", a: "Does the shipping company"}, {t: "Can anyone get it back?", a: "Can someone go down"}, {t: "Who owns it if it’s found?", a: "And if somebody finds"}]}
  - {at: "Some containers stay trapped", dur: 3.2, kind: label, text: "Trapped in the *wreck*"}
  - {at: "Some break free", dur: 3.4, kind: label, text: "Sink on their *own*"}
  - {at: "And some float", dur: 3.0, kind: label, text: "Some *float*"}
  - {at: "Curtis Ebbesmeyer", dur: 3.4, kind: label, text: "*Curtis Ebbesmeyer*", sub: "Oceanographer, Seattle"}
  - {at: "released 28,800 plastic", dur: 3.6, kind: big, text: "28,800", sub: "BATH TOYS · NORTH PACIFIC · 1992"}
  - {at: "About ten months later", dur: 3.6, kind: label, text: "*Alaska*", sub: "≈ 2,000 miles from the spill"}
  - {at: "4.8 million pieces", dur: 3.6, kind: big, text: "4.8 million", sub: "PIECES OF LEGO"}
  - {at: "The first is full of electronics", dur: 3.0, kind: label, text: "1 · *Electronics*", sub: "Salt water → corrosion"}
  - {at: "The second is a refrigerated", dur: 3.0, kind: label, text: "2 · *Reefer* (food)", sub: "No power → spoils"}
  - {at: "The third holds industrial", dur: 3.0, kind: label, text: "3 · *Machinery*", sub: "Repairs may cost more than it’s worth"}
  - {at: "And the fourth is full", dur: 3.4, kind: label, text: "4 · *Plastic pellets*", sub: "Bags burst → coastlines"}
  - {at: "1,281 meters deep", dur: 3.2, kind: big, text: "1,281 m", sub: "BELOW THE SURFACE"}
  - {at: "more than a thousand car tires", dur: 3.0, kind: label, text: "*1,000+* car tires"}
  - {at: "called ROVs", dur: 3.0, kind: label, text: "*ROV*", sub: "Remotely operated vehicle"}
  - {at: "In October 2011", dur: 3.4, kind: label, text: "*Rena*", sub: "Astrolabe Reef, New Zealand · October 2011"}
  - {at: "carrying 1,368 containers", dur: 3.0, kind: label, text: "*1,368* containers on board"}
  - {at: "Lloyd’s Open Form", until: ">no pay.”", kind: quote, text: "No cure, no pay.", who: "Lloyd’s Open Form"}
  - {at: "a bill of lading", dur: 3.2, kind: label, text: "Bill of *lading*", sub: "Receipt + contract in one"}
  - {at: "“perils of the sea,”", dur: 3.2, kind: label, text: "“Perils of the *sea*”"}
  - {at: "Carriage of Goods by Sea Act", dur: 3.4, kind: label, text: "Carriage of Goods by Sea *Act*", sub: "United States"}
  - {at: "$500 per package", dur: 3.6, kind: big, text: "$500", sub: "PER PACKAGE · U.S. LIABILITY CAP"}
  - {at: "The ship itself is covered", dur: 3.6, kind: label, text: "Hull & *machinery*", sub: "Covers the ship"}
  - {at: "short for protection and indemnity", dur: 3.6, kind: label, text: "*P&I*", sub: "Protection & indemnity: the owner’s duties to others"}
  - {at: "And your goods are covered", dur: 3.6, kind: label, text: "Marine *cargo* insurance", sub: "Covers your goods, if you bought it"}
  - {at: "That’s called subrogation", dur: 3.0, kind: label, text: "*Subrogation*", sub: "Insurer pays you, then chases the carrier"}
  - {at: "So, everyone whose cargo", dur: 3.4, kind: label, text: "Everyone *chips in*"}
  - {at: "York-Antwerp Rules", dur: 3.2, kind: label, text: "The *York-Antwerp* Rules"}
  - {at: "Five crew members lost", dur: 2.8, kind: label, text: "Five crew members lost"}
  - {at: "Containers washed up on a beach", dur: 3.6, kind: label, text: "*Branscombe*", sub: "Devon, England · January 2007"}
  - {at: "Receiver of Wreck", dur: 3.4, kind: label, text: "Receiver of *Wreck*", sub: "Report finds within 28 days"}
  - {at: "It might still belong", dur: 3.4, kind: label, text: "Still the *owner’s*", sub: "or the insurer’s, if it paid out"}
  - {at: "A finder might earn", dur: 3.4, kind: label, text: "A *reward*, not ownership"}
  - {at: "And here’s a twist", dur: 4.0, kind: label, text: "Box and goods", sub: "can belong to different companies"}
  - {at: "In May 2021", dur: 3.6, kind: label, text: "*X-Press Pearl*", sub: "Off Sri Lanka · May 2021"}
  - {at: "Nairobi Wreck Removal", dur: 3.6, kind: label, text: "Nairobi *Wreck Removal* Convention", sub: "In force since 2015"}
  - {at: "$1 billion in compensation", dur: 3.4, kind: big, text: "$1 billion", sub: "INITIAL COMPENSATION ORDERED"}
  - {at: "On June 27, 2013", dur: 3.6, kind: label, text: "June 27 · *back half sinks*", sub: "≈ 4,000 m · ≈ 1,700 containers"}
  - {at: "Tugboats were still towing", dur: 3.6, kind: label, text: "July 6 · *front half on fire*"}
  - {at: "On July 10", dur: 3.6, kind: label, text: "July 10 · *front half sinks*", sub: "≈ 3,000 m · ≈ 2,400 containers"}
  - {at: "$300 million and $400 million", dur: 4.4, kind: big, text: "$300–400M", sub: "INSURED CARGO LOSS · IUMI ESTIMATE"}

